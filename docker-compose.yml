#Stack Orchestration
services:
  api:
    build: .
    image: turballoc:latest
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: uvicorn turballoc.serve.app:app --host 0.0.0.0 --port 8000

  scheduler:
    build: .
    image: turballoc:latest
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: python -m turballoc.ingest.flows









    