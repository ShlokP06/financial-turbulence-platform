[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "turballoc"
version = "0.1.0"
description = "AI-powered financial turbulence detection and dynamic asset reallocation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Shlok Parikh" }]
keywords = ["finance", "turbulence", "asset-allocation", "machine-learning", "quant"]

dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    "python-dotenv>=1.0",
    "pyarrow>=15.0",
    "duckdb>=0.10",
    "yfinance>=0.2.37",
    "fredapi>=0.5.1",
    "praw>=7.7",
    "requests>=2.31",
    "httpx>=0.27",
    "transformers>=4.39",
    "torch>=2.2",
    "PyPortfolioOpt>=1.5.5",
    "scikit-optimize>=0.10",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "prefect>=2.16",
    "tqdm>=4.66"
]

[project.optional-dependencies]
rl = ["stable-baselines3>=2.3", "gymnasium>=0.29"]
dev = [
    "pytest>=8.1",
    "pytest-cov>=5.0",
    "black>=24.3",
    "ruff>=0.3",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "httpx>=0.27",
]

[project.urls]
Repository = "https://github.com/ShlokP06/financial-turbulence-platform"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM"]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=turballoc --cov-report=term-missing"

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true
